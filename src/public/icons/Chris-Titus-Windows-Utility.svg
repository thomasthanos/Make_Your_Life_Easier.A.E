<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <!-- Inner Emblem Subtle 3D Shadow -->
    <filter id="ctt-emblem-shadow" x="28" y="54" width="200" height="148" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000814" flood-opacity="0.75" />
    </filter>

    <!-- Main Deep Carbon-Navy Background -->
    <linearGradient id="ctt-bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1F38" />
      <stop offset="50%" stop-color="#071120" />
      <stop offset="100%" stop-color="#03070E" />
    </linearGradient>

    <!-- Ambient Electric Azure Glow -->
    <radialGradient id="ctt-glow-top" cx="28%" cy="18%" r="78%">
      <stop offset="0%" stop-color="#1EA8FF" stop-opacity="0.42" />
      <stop offset="55%" stop-color="#005A9E" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#071120" stop-opacity="0" />
    </radialGradient>

    <!-- Bottom-Right Secondary Glow -->
    <radialGradient id="ctt-glow-bottom" cx="82%" cy="86%" r="62%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#071120" stop-opacity="0" />
    </radialGradient>

    <!-- macOS 3D Glass Bevel Border -->
    <linearGradient id="ctt-glass-rim" x1="128" y1="0" x2="128" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.68" />
      <stop offset="25%" stop-color="#1EA8FF" stop-opacity="0.32" />
      <stop offset="80%" stop-color="#0A2747" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.42" />
    </linearGradient>

    <!-- Top Specular Sheen -->
    <linearGradient id="ctt-sheen" x1="128" y1="0" x2="128" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Smooth Prompt Chevron Gradient -->
    <linearGradient id="ctt-prompt-grad" x1="88" y1="74" x2="88" y2="174" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Cursor Bar Gradient -->
    <linearGradient id="ctt-cursor-grad" x1="134" y1="162" x2="202" y2="162" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>

    <!-- macOS Squircle Clip -->
    <clipPath id="ctt-squircle-clip">
      <rect x="0" y="0" width="256" height="256" rx="58" />
    </clipPath>
  </defs>

  <!-- Base Squircle & Internal Lighting (Χωρίς εξωτερικό shadow) -->
  <g clip-path="url(#ctt-squircle-clip)">
    <rect x="0" y="0" width="256" height="256" fill="url(#ctt-bg)" />
    <rect x="0" y="0" width="256" height="256" fill="url(#ctt-glow-top)" />
    <rect x="0" y="0" width="256" height="256" fill="url(#ctt-glow-bottom)" />
    <!-- Top Glass Reflection Curve -->
    <ellipse cx="128" cy="4" rx="126" ry="64" fill="url(#ctt-sheen)" />
  </g>

  <!-- 3D Inner Glass Rim -->
  <rect x="1.5" y="1.5" width="253" height="253" rx="56.5" stroke="url(#ctt-glass-rim)" stroke-width="3" />

  <!-- Terminal Prompt ">_" Emblem -->
  <g filter="url(#ctt-emblem-shadow)">
    <!-- '>' Chevron -->
    <path d="M58 82L120 124L58 166" stroke="url(#ctt-prompt-grad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

    <!-- '_' Underscore Cursor -->
    <rect x="134" y="152" width="66" height="24" rx="12" fill="url(#ctt-cursor-grad)" />
  </g>
</svg>