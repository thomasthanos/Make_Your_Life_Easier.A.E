<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07080c" />
  <meta name="description"
    content="Make Your Life Easier - A comprehensive tool for system management and productivity" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file: https:; font-src 'self'; connect-src 'self' https:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none';" />
  <title>Make Your Life Easier</title>

  <style>
    html, body {
      background-color: #07080c !important;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
  </style>

  <link rel="preload" href="styles/main.css" as="style" />
  <link rel="modulepreload" href="index.js" />
  <link rel="modulepreload" href="utils.js" />
  <link rel="modulepreload" href="components.js" />
  <link rel="modulepreload" href="managers.js" />
  <link rel="modulepreload" href="core.js" />
  <link rel="modulepreload" href="services.js" />
  <link rel="modulepreload" href="notifications.js" />
  <link rel="modulepreload" href="pages/installers.js" />
  <link rel="preload" href="../config/favicon-config.js" as="script" />
  <link rel="preload" href="../config/titlebar-init.js" as="script" />
  <link rel="preload" href="../assets/icons/hacker.ico" as="image" type="image/x-icon" />

  <link rel="preconnect" href="https://t2.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://t2.gstatic.com" />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  <link rel="dns-prefetch" href="https://i.postimg.cc" />
  <link rel="dns-prefetch" href="https://raw.githubusercontent.com" />
  <link rel="dns-prefetch" href="https://pmecdn.protonweb.com" />
  <link rel="dns-prefetch" href="https://cdn.discordapp.com" />
  <link rel="dns-prefetch" href="https://lh3.googleusercontent.com" />

  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/usability.css" />
  <link rel="icon" type="image/x-icon" href="../assets/icons/hacker.ico" />
</head>

<body>
  <div class="custom-title-bar">
    <button class="sidebar-collapse-toggle" id="sidebar-collapse-toggle" aria-label="Toggle menu" data-tooltip="Toggle menu">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
    <div class="title-group">
      <img class="title-bar-app-icon" src="../assets/icons/hacker.ico" alt="App icon" />
      <div class="title-bar-title">Make Your Life Easier</div>
    </div>
    <div class="title-bar-menu">
      <button id="menu-toggle" class="menu-toggle" aria-label="Menu" data-tooltip="Menu"></button>
      <div id="titlebar-menu-dropdown" class="menu-dropdown hidden">
        <button id="lang-toggle" class="lang-toggle">EN</button>
        <button id="info-toggle" class="info-toggle"></button>
      </div>
    </div>
    <div class="title-bar-controls">
      <button class="title-bar-btn minimize" id="title-bar-minimize" aria-label="Minimize">
        <svg class="minimize-icon" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true">
          <rect x="2" y="6" width="8" height="1" fill="currentColor"></rect>
        </svg>
      </button>
      <button class="title-bar-btn maximize" id="title-bar-maximize" aria-label="Maximize">
        <svg class="maximize-icon" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true">
          <rect x="1" y="1" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1"></rect>
        </svg>
      </button>
      <button class="title-bar-btn close" id="title-bar-close" aria-label="Close">
        <svg class="close-icon" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true">
          <line x1="2" y1="2" x2="10" y2="10" stroke="currentColor" stroke-width="1" stroke-linecap="round"></line>
          <line x1="10" y1="2" x2="2" y2="10" stroke="currentColor" stroke-width="1" stroke-linecap="round"></line>
        </svg>
      </button>
    </div>
  </div>
  <div id="app">
    <nav id="sidebar" role="navigation" aria-label="Sidebar">
      <div class="sidebar-header">
        <img class="sidebar-logo" src="../assets/icons/hacker.ico" alt="" aria-hidden="true" />
        <div class="title-group">
          <div class="app-title"></div>
          <div class="app-subtitle"></div>

        </div>
      </div>
      <ul id="menu-list"></ul>
      <div class="sidebar-footer">
        <div class="user-info" id="userInfo"></div>
        <div class="version-wrap" data-tooltip="App version">
          <span id="appVersion" class="version-text">v...</span>
        </div>
      </div>
    </nav>
    <main id="main" role="main">
      <div id="content" class="content"></div>
    </main>
  </div>

  <script src="../config/favicon-config.js"></script>
  <script src="../config/titlebar-init.js"></script>
  <script type="module" src="index.js"></script>

</body>

</html>
