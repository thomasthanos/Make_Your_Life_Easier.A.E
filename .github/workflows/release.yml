# Builds the Windows installer and publishes it as a GitHub release.
#
# Release: bump "version" in package.json (and src-tauri/Cargo.toml), commit,
# then push a matching tag:   git tag v5.0.1 && git push origin v5.0.1
#
# The app's updater (src-tauri/src/updater.rs) reads the latest release and
# installs its *_x64-setup.exe after checking the SHA-256 digest GitHub
# publishes for every asset.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package.json version $version"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - run: npm ci

      # Also downloads and verifies the pinned Ludusavi runtime for Game Saves
      # (scripts/bootstrap-game-saves.ps1); those files are not in Git.
      - run: npm run tauri build

      - name: Collect the installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*_x64-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "The NSIS installer was not produced." }
          # No spaces: GitHub would rename "Make Your Life Easier_…" anyway.
          $name = "MakeYourLifeEasier_${env:VERSION}_x64-setup.exe"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $setup.FullName "out/$name"

          # latest.yml is what the old Electron app (v4.x) looks for in the
          # latest release. Pointing it at this installer lets those installs
          # update into the rewrite; the new app itself does not use it.
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path "out/$name"))
          $sha512 = [Convert]::ToBase64String([Security.Cryptography.SHA512]::Create().ComputeHash($bytes))
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
          @(
            "version: ${env:VERSION}"
            "files:"
            "  - url: $name"
            "    sha512: $sha512"
            "    size: $($bytes.Length)"
            "path: $name"
            "sha512: $sha512"
            "releaseDate: '$date'"
          ) | Set-Content -Path out/latest.yml -Encoding utf8NoBOM

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem out).FullName `
            --title "Make Your Life Easier ${{ github.ref_name }}" `
            --generate-notes
