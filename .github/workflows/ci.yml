# Checks every push to main and every pull request: the download site, the
# frontend, and the Rust backend (clippy and the unit tests). The backend is
# Windows-only, so everything runs on Windows. Releases stay in release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run check

      # tauri::generate_context! embeds the built frontend (dist/).
      - run: npm run build

      # The bundle lists the pinned Ludusavi files, and the build checks
      # that they exist; they are downloaded and verified, never committed.
      - run: npm run prepare:game-saves

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked
