<svg xmlns="http://www.w3.org/2000/svg" width="360" height="110" viewBox="0 0 360 110" role="img" aria-label="ThomasThanos - GitHub and Email">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#122034"/><stop offset="1" stop-color="#0a1220"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".04"/>
    </linearGradient>
    <radialGradient id="w" cx="1" cy="0" r=".9">
      <stop offset="0" stop-color="#7bead2" stop-opacity=".16"/>
      <stop offset="1" stop-color="#7bead2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" gradientUnits="userSpaceOnUse" x1="28" y1="20" x2="200" y2="20">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9d6e8"/>
    </linearGradient>
  </defs>
  
  <!-- Background and border -->
  <rect x=".8" y=".8" width="358.4" height="108.4" rx="16" fill="url(#bg)"/>
  <rect x=".8" y=".8" width="358.4" height="108.4" rx="16" fill="url(#w)"/>
  <rect x=".8" y=".8" width="358.4" height="108.4" rx="16" fill="none" stroke="url(#edge)" stroke-width="1.2"/>
  
  <g font-family='"Comic Sans MS", cursive, sans-serif'>
    <!-- Header -->
    <text x="28" y="40" font-size="22" font-weight="800" letter-spacing="-0.5" fill="url(#textGrad)">ThomasThanos</text>
    <rect x="28" y="52" width="40" height="2" rx="1" fill="#ffb84e" opacity=".85"/>
    
    <!-- GitHub row -->
    <text x="28" y="74" font-size="12" font-weight="700" fill="#8296b3">GitHub</text>
    <text x="80" y="74" font-size="12" font-weight="600" fill="#c9d6e8">@thomasthanos</text>
    
    <!-- Email row -->
    <text x="28" y="92" font-size="12" font-weight="700" fill="#8296b3">Email</text>
    <text x="80" y="92" font-size="12" font-weight="600" fill="#7bead2">thomasthanos28@gmail.com</text>
  </g>
</svg>