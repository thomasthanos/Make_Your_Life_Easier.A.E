<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="524" viewBox="0 0 1200 524" role="img" aria-labelledby="t d">
  <title id="t">What's inside Make Your Life Easier</title>
  <desc id="d">Eight tools: Install Apps, Game Saves, Spotify Hub, Creative Hub, Windows Optimization, System Cleaner, System Maintenance, and Sync and Updates.</desc>
  <style>
    text { font-family: 'Segoe UI Variable Text', 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 19.5px; font-weight: 700; fill: #eef0ff; letter-spacing: -.2px; }
    .desc { font-size: 13.5px; fill: #9aa3c7; }
    .mono { font-family: 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace; font-size: 11.5px; letter-spacing: .3px; }
    .card { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
    .bloom { transform-box: fill-box; transform-origin: center; animation: bloom 5s ease-in-out infinite; }
    .snap { animation: snap 3.6s ease-in-out infinite; }
    .eq { transform-box: fill-box; transform-origin: bottom; animation: eq 1.1s ease-in-out infinite alternate; }
    .bounce { animation: bounce 1.4s ease-in-out infinite; }
    .needle { transform-box: fill-box; transform-origin: 50% 100%; animation: needle 3.2s cubic-bezier(.45,0,.2,1) infinite alternate; }
    .shrink { transform-box: fill-box; transform-origin: left; animation: shrink 3.4s ease-in-out infinite; }
    .twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 1.7s ease-in-out infinite; }
    .tick { stroke-dasharray: 12; stroke-dashoffset: 12; animation: tick 4.2s ease-out infinite; }
    .ring { animation: ring 4.2s ease-out infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
    @keyframes bloom { 0%, 100% { opacity: .55; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.1); } }
    @keyframes snap { 0%, 15% { opacity: .18; } 30%, 80% { opacity: 1; } 100% { opacity: .18; } }
    @keyframes eq { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
    @keyframes bounce { 0%, 100% { transform: translateY(-3px); } 50% { transform: translateY(3px); } }
    @keyframes needle { from { transform: rotate(-65deg); } to { transform: rotate(65deg); } }
    @keyframes shrink { 0%, 12% { transform: scaleX(1); opacity: 1; } 60%, 78% { transform: scaleX(.06); opacity: .5; } 100% { transform: scaleX(1); opacity: 1; } }
    @keyframes twinkle { 0%, 100% { transform: scale(.5); opacity: .3; } 50% { transform: scale(1.2); opacity: 1; } }
    @keyframes tick { 0%, 8% { stroke-dashoffset: 12; } 22%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes ring { 0%, 8% { stroke-opacity: .25; } 22%, 85% { stroke-opacity: 1; } 100% { stroke-opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .tick { stroke-dashoffset: 0; } }
  </style>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#171e35" />
      <stop offset="1" stop-color="#0e1325" />
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#aab4ff" stop-opacity=".26" />
      <stop offset="1" stop-color="#aab4ff" stop-opacity=".07" />
    </linearGradient>
    <clipPath id="clip"><rect width="282" height="250" rx="22" /></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14" /></filter>
    <symbol id="base" viewBox="0 0 282 250">
      <rect x=".75" y=".75" width="280.5" height="248.5" rx="22" fill="url(#face)" stroke="url(#edge)" stroke-width="1.5" />
    </symbol>
  </defs>

