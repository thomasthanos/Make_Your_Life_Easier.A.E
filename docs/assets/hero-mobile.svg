<svg xmlns="http://www.w3.org/2000/svg" width="390" height="310" viewBox="0 0 390 310" role="img" aria-labelledby="t d">
  <title id="t">Make Your Life Easier</title>
  <desc id="d">A compact animated terminal banner for smaller screens. Apps, game saves, cleanup and Windows tools.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111a31"/><stop offset="1" stop-color="#0a1020"/></linearGradient>
    <linearGradient id="line" x2="1" y2="0"><stop stop-color="#a99eff"/><stop offset="1" stop-color="#6cdbed"/></linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="388" height="308" rx="21"/></clipPath>
    <clipPath id="terminal"><rect x="24" y="181" width="342" height="105" rx="9"/></clipPath>
  </defs>
  <style>
    text{font-family:'Segoe UI Variable Display','Segoe UI',Arial,sans-serif}
    .code{stroke-dasharray:145;stroke-dashoffset:0;animation:write 5s ease-in-out infinite}
    .code.two{animation-delay:-1.6s}.code.three{animation-delay:-3.2s}
    .cursor{animation:blink 1.1s steps(1,end) infinite}
    .signal{animation:pulse 2.8s ease-in-out infinite}
    @keyframes write{0%,10%{stroke-dashoffset:145}38%,78%{stroke-dashoffset:0}100%{stroke-dashoffset:-145}}
    @keyframes blink{50%{opacity:0}}
    @keyframes pulse{50%{opacity:.35}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.code{stroke-dashoffset:0}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="390" height="310" fill="url(#bg)"/>
    <rect width="390" height="4" fill="url(#line)"/>
    <path d="M25 30h20" stroke="#a99eff" stroke-width="3" stroke-linecap="round"/>
    <text x="55" y="34" font-size="10" font-weight="700" letter-spacing="2" fill="#aab8df">YOUR WINDOWS TOOLKIT</text>
    <text x="24" y="85" font-size="38" font-weight="800" letter-spacing="-1.5" fill="#fff">Make Your</text>
    <text x="24" y="127" font-size="38" font-weight="800" letter-spacing="-1.5" fill="#fff">Life Easier<tspan fill="#6cdbed">.</tspan></text>
    <text x="25" y="152" font-size="12.5" fill="#c5d1e8">Apps, saves, cleanup and Windows tools.</text>
    <rect x="17" y="169" width="356" height="129" rx="15" fill="#1b2946" stroke="#8fa3e4" stroke-opacity=".55"/>
    <circle cx="35" cy="180" r="3" fill="#ff8fa1"/><circle cx="46" cy="180" r="3" fill="#f0b86e"/><circle cx="57" cy="180" r="3" fill="#60d9af"/>
    <text x="351" y="183" text-anchor="end" font-size="8" letter-spacing="1.1" fill="#adbce0">MYLE / READY</text>
    <rect x="24" y="191" width="342" height="95" rx="9" fill="#0c1529"/>
    <g clip-path="url(#terminal)">
      <text x="39" y="210" font-family="Consolas,monospace" font-size="10" fill="#7ce0ed">&gt; ready when you are</text>
      <g fill="none" stroke="#9daed7" stroke-opacity=".42" stroke-width="5" stroke-linecap="round">
        <path d="M40 226h40m10 0h80M50 242h74m10 0h51M40 258h61m10 0h67"/>
      </g>
      <g fill="none" stroke-width="5" stroke-linecap="round">
        <path class="code" d="M40 226h40m10 0h80" stroke="#a99eff"/>
        <path class="code two" d="M50 242h74m10 0h51" stroke="#6cdbed"/>
        <path class="code three" d="M40 258h61m10 0h67" stroke="#f0b86e"/>
      </g>
      <path d="m278 224 13 12-13 12m33-24-13 12 13 12m-17-29-7 35" fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect class="cursor" x="40" y="271" width="5" height="10" fill="#6cdbed"/>
      <circle class="signal" cx="345" cy="272" r="3" fill="#60d9af"/>
    </g>
  </g>
  <rect x="1" y="1" width="388" height="308" rx="21" fill="none" stroke="#9ba9e8" stroke-opacity=".35" stroke-width="2"/>
</svg>
