<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="188" viewBox="0 0 1200 188" role="img" aria-labelledby="title description">
  <title id="title">Made with care by ThomasThanos</title>
  <desc id="description">A custom closing card for Make Your Life Easier. Visit ThomasThanos on GitHub.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#151e36"/><stop offset="1" stop-color="#0c1222"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="0"><stop stop-color="#a69cff"/><stop offset="1" stop-color="#62d9ed"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b4bfff" stroke-opacity=".055"/></pattern>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="186" rx="24"/></clipPath>
  </defs>
  <style>
    text{font-family:'Segoe UI Variable Display','Segoe UI',Inter,system-ui,Arial,sans-serif}
    .pulse{animation:pulse 3s ease-in-out infinite}
    .cursor{animation:blink 1.1s steps(1,end) infinite}
    @keyframes pulse{50%{opacity:.45}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="188" fill="url(#bg)"/>
    <rect width="1200" height="188" fill="url(#grid)"/>
    <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
    <rect x="52" y="38" width="108" height="108" rx="26" fill="#101a30" stroke="#9d9cff" stroke-opacity=".5" stroke-width="2"/>
    <rect x="67" y="58" width="78" height="61" rx="9" fill="#1b2947" stroke="#82a5ef" stroke-opacity=".6"/>
    <circle cx="78" cy="69" r="2.5" fill="#ff8fa1"/><circle cx="87" cy="69" r="2.5" fill="#f0b86e"/><circle cx="96" cy="69" r="2.5" fill="#60d9af"/>
    <path d="m82 88 9 8-9 8m27-16-9 8 9 8m-12-19-5 23" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M79 129h54" stroke="#69dcef" stroke-width="3" stroke-linecap="round"/>
    <text x="195" y="75" font-size="14" font-weight="700" letter-spacing="2.4" fill="#9daee4">THE END OF THE README, NOT THE IDEAS</text>
    <text x="193" y="115" font-size="32" font-weight="800" fill="#f1f4ff">Made to make the little things easier<tspan fill="#71dce9">.</tspan></text>
    <text x="195" y="144" font-size="16" fill="#b7c4e3">Built with care and coffee by <tspan font-weight="700" fill="#b3a9ff">ThomasThanos</tspan><tspan class="cursor" fill="#71dce9"> _</tspan></text>
    <path d="M1055 71h72v48h-72" fill="none" stroke="#9ea9ee" stroke-opacity=".22" stroke-width="2"/>
    <path d="m1080 84 12 11-12 11m24-11h-11" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="pulse" cx="1127" cy="94" r="4" fill="#6adfc4"/>
  </g>
  <rect x="1" y="1" width="1198" height="186" rx="24" fill="none" stroke="#9ca9eb" stroke-opacity=".28" stroke-width="2"/>
</svg>
