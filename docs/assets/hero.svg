<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">Make Your Life Easier</title>
  <desc id="description">A crisp animated terminal illustration beside the Make Your Life Easier title. Apps, game saves, cleanup and Windows tools in one place.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#10172b"/><stop offset=".52" stop-color="#0b1120"/><stop offset="1" stop-color="#090d19"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#a69cff"/><stop offset="1" stop-color="#62d9ed"/>
    </linearGradient>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#1c2845"/><stop offset="1" stop-color="#111a30"/>
    </linearGradient>
    <linearGradient id="scan" x2="0" y2="1">
      <stop stop-color="#5ad8ee" stop-opacity="0"/><stop offset=".5" stop-color="#5ad8ee" stop-opacity=".11"/><stop offset="1" stop-color="#5ad8ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#9ba7dc" stroke-opacity=".065"/>
    </pattern>
    <clipPath id="outer"><rect x="1" y="1" width="1198" height="428" rx="28"/></clipPath>
    <clipPath id="terminal"><rect x="700" y="122" width="398" height="218" rx="12"/></clipPath>
  </defs>
  <style>
    text{font-family:'Segoe UI Variable Display','Segoe UI',Inter,system-ui,Arial,sans-serif}
    .trace{stroke-dasharray:320;stroke-dashoffset:320;animation:draw 6s ease-in-out infinite}
    .trace.two{animation-delay:-1.4s}.trace.three{animation-delay:-2.8s}
    .cursor{animation:blink 1.1s steps(1,end) infinite}
    .scan{animation:scan 7s ease-in-out infinite}
    .status{animation:status 3s ease-in-out infinite}
    .orbit{transform-origin:905px 229px;animation:orbit 28s linear infinite}
    @keyframes draw{0%,8%{stroke-dashoffset:320;opacity:.45}34%,76%{stroke-dashoffset:0;opacity:1}94%,100%{stroke-dashoffset:-320;opacity:.45}}
    @keyframes blink{50%{opacity:0}}
    @keyframes scan{0%,12%{transform:translateY(-166px);opacity:0}20%{opacity:1}72%{transform:translateY(214px);opacity:1}82%,100%{transform:translateY(214px);opacity:0}}
    @keyframes status{50%{opacity:.35}}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.trace{stroke-dashoffset:0}.scan{display:none}}
  </style>
  <g clip-path="url(#outer)">
    <rect width="1200" height="430" fill="url(#background)"/>
    <rect width="1200" height="430" fill="url(#grid)"/>
    <path d="M0 0h1200v5H0z" fill="url(#accent)"/>
    <path d="M632 0v430" stroke="#9faaf0" stroke-opacity=".12"/>
    <path d="M72 62h23" stroke="#9d94ff" stroke-width="3" stroke-linecap="round"/>
    <text x="110" y="68" font-size="14" font-weight="700" letter-spacing="3" fill="#a9b5dc">YOUR WINDOWS TOOLKIT</text>
    <text x="70" y="160" font-size="68" font-weight="800" letter-spacing="-2.8" fill="#f5f6ff">Make Your</text>
    <text x="70" y="231" font-size="68" font-weight="800" letter-spacing="-2.8" fill="url(#accent)">Life Easier<tspan fill="#62d9ed">.</tspan></text>
    <text x="73" y="277" font-size="19" fill="#bac5e4">Apps, game saves, cleanup and Windows tools.</text>
    <text x="73" y="305" font-size="19" fill="#bac5e4">Everything in one quiet place.</text>
    <g font-size="13" font-weight="700" letter-spacing="1.1">
      <rect x="72" y="344" width="126" height="36" rx="18" fill="#1b2540" stroke="#9d94ff" stroke-opacity=".5"/>
      <circle cx="92" cy="362" r="4" fill="#a69cff"/><text x="105" y="367" fill="#e2defe">TAURI 2</text>
      <rect x="209" y="344" width="133" height="36" rx="18" fill="#1b2540" stroke="#62d9ed" stroke-opacity=".45"/>
      <circle cx="229" cy="362" r="4" fill="#62d9ed"/><text x="242" y="367" fill="#dcf9fe">SVELTE 5</text>
      <rect x="353" y="344" width="104" height="36" rx="18" fill="#1b2540" stroke="#f0b86e" stroke-opacity=".45"/>
      <circle cx="373" cy="362" r="4" fill="#f0b86e"/><text x="386" y="367" fill="#fff0d7">RUST</text>
    </g>

    <circle class="orbit" cx="905" cy="229" r="189" fill="none" stroke="#97a5ef" stroke-opacity=".19" stroke-dasharray="3 12"/>
    <circle cx="905" cy="229" r="161" fill="none" stroke="#6bd8ee" stroke-opacity=".1"/>
    <rect x="677" y="58" width="456" height="314" rx="22" fill="#080d19" stroke="#8b9de2" stroke-opacity=".36" stroke-width="2"/>
    <rect x="686" y="67" width="438" height="296" rx="16" fill="url(#panel)"/>
    <path d="M686 105h438" stroke="#a8b4ef" stroke-opacity=".2"/>
    <circle cx="713" cy="86" r="5" fill="#ff8f9f"/><circle cx="733" cy="86" r="5" fill="#f1bd76"/><circle cx="753" cy="86" r="5" fill="#63d7ad"/>
    <text x="905" y="91" text-anchor="middle" font-size="12" letter-spacing="2" fill="#aebadd">MYLE / CONTROL CENTER</text>
    <circle class="status" cx="1095" cy="86" r="4" fill="#61dfaf"/>
    <rect x="700" y="122" width="398" height="218" rx="12" fill="#0b1428" stroke="#96a7e9" stroke-opacity=".16"/>
    <g clip-path="url(#terminal)">
      <path d="M720 285h358M720 308h358" stroke="#a1b9f9" stroke-opacity=".08"/>
      <rect class="scan" x="701" y="122" width="396" height="52" fill="url(#scan)"/>
      <text x="725" y="151" font-family="Consolas,monospace" font-size="13" fill="#73e6f4">&gt; ready when you are</text>
      <g fill="none" stroke="#aab7e5" stroke-opacity=".38" stroke-linecap="round" stroke-width="7">
        <path d="M726 179h57m13 0h96M744 201h104m14 0h50M744 223h71m14 0h118M726 245h89m13 0h62"/>
      </g>
      <g fill="none" stroke-linecap="round" stroke-width="7">
        <path class="trace" d="M726 179h57m13 0h96" stroke="#a99eff"/>
        <path class="trace two" d="M744 201h104m14 0h50" stroke="#68d9ec"/>
        <path class="trace three" d="M744 223h71m14 0h118" stroke="#f0b86e"/>
        <path class="trace" d="M726 245h89m13 0h62" stroke="#7eb4fa"/>
      </g>
      <path d="M726 278h16" stroke="#6ce1ed" stroke-width="2"/>
      <rect class="cursor" x="751" y="268" width="8" height="17" rx="1" fill="#68e0ed"/>
      <path d="M964 184l24 18-24 18m58-36l-24 18 24 18" fill="none" stroke="#9d99ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1002 175l-16 54" stroke="#6bddec" stroke-width="5" stroke-linecap="round"/>
      <rect x="725" y="302" width="348" height="19" rx="9.5" fill="#192941"/>
      <rect x="729" y="306" width="206" height="11" rx="5.5" fill="url(#accent)"/>
      <text x="1057" y="316" text-anchor="end" font-family="Consolas,monospace" font-size="10" fill="#e0e9ff">ALL SYSTEMS READY</text>
    </g>
    <path d="M709 372h390" stroke="url(#accent)" stroke-opacity=".7" stroke-width="2"/>
  </g>
  <rect x="1" y="1" width="1198" height="428" rx="28" fill="none" stroke="#a5b2ee" stroke-opacity=".25" stroke-width="2"/>
</svg>
