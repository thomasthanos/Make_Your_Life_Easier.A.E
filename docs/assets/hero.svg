<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
  <title id="t">Make Your Life Easier</title>
  <desc id="d">A hooded coder writing code on a glowing screen, above the app's name: apps, game saves, cleanup and Windows tools in one place.</desc>
  <style>
    .glow-a { animation: drift-a 14s ease-in-out infinite alternate; }
    .glow-b { animation: drift-b 17s ease-in-out infinite alternate; }
    .star { animation: twinkle 4s ease-in-out infinite; }
    .halo { transform-box: fill-box; transform-origin: center; animation: pulse 4.5s ease-in-out infinite; }
    .orbit { transform-origin: 600px 133px; animation: spin 26s linear infinite; }
    .orbit.rev { animation-duration: 38s; animation-direction: reverse; }
    .ln { transform-box: fill-box; transform-origin: left center; animation: type 7s cubic-bezier(.3,.7,.3,1) infinite both; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .spark { transform-box: fill-box; transform-origin: center; animation: sparkle 3.2s ease-in-out infinite; }
    .coder { animation: bob 2.4s ease-in-out infinite; }
    .screen-glow { animation: flicker 5s ease-in-out infinite; }
    .chip-dot { transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-in-out infinite; }
    .rise { animation: rise 1s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes drift-a { to { transform: translate(90px, 30px); } }
    @keyframes drift-b { to { transform: translate(-110px, -26px); } }
    @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
    @keyframes pulse { 0%, 100% { transform: scale(.92); opacity: .65; } 50% { transform: scale(1.06); opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes type {
      0% { transform: scaleX(0); opacity: 1; }
      9% { transform: scaleX(1); }
      82% { transform: scaleX(1); opacity: 1; }
      92%, 100% { transform: scaleX(1); opacity: 0; }
    }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes sparkle { 0%, 100% { transform: scale(.7) rotate(0deg); opacity: .6; } 50% { transform: scale(1.15) rotate(90deg); opacity: 1; } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @keyframes flicker { 0%, 100% { opacity: .8; } 45% { opacity: 1; } 55% { opacity: .7; } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1020" />
      <stop offset=".5" stop-color="#11172b" />
      <stop offset="1" stop-color="#090d19" />
    </linearGradient>
    <radialGradient id="glow-indigo">
      <stop stop-color="#7f76ff" stop-opacity=".42" />
      <stop offset="1" stop-color="#7f76ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-cyan">
      <stop stop-color="#45c8e6" stop-opacity=".26" />
      <stop offset="1" stop-color="#45c8e6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="halo">
      <stop offset=".45" stop-color="#8b83ff" stop-opacity=".42" />
      <stop offset="1" stop-color="#8b83ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="grid-fade" cx=".5" cy=".38" r=".62">
      <stop stop-color="#fff" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <mask id="grid-mask"><rect width="1200" height="440" fill="url(#grid-fade)" /></mask>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0v34" fill="none" stroke="#8e9bd0" stroke-opacity=".09" />
    </pattern>
    <linearGradient id="title" x1="360" y1="0" x2="840" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop stop-color="#f5f6ff" />
      <stop offset=".45" stop-color="#c9c3ff" />
      <stop offset=".75" stop-color="#8fe6f6" />
      <stop offset="1" stop-color="#f5f6ff" />
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#aab4ff" stop-opacity=".32" />
      <stop offset="1" stop-color="#aab4ff" stop-opacity=".06" />
    </linearGradient>
    <linearGradient id="orbit-fade-g" x1="0" y1="0" x2="0" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" />
      <stop offset=".4" stop-color="#fff" />
      <stop offset=".54" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <mask id="orbit-fade"><rect width="1200" height="440" fill="url(#orbit-fade-g)" /></mask>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="438" rx="30" /></clipPath>

    <!-- The app icon (backend/icons/app-icon.svg), ids prefixed with i- -->
    <linearGradient id="i-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a45" />
      <stop offset="1" stop-color="#0c0f18" />
    </linearGradient>
    <radialGradient id="i-spill" cx=".5" cy=".42" r=".58">
      <stop offset="0" stop-color="#6f7dff" stop-opacity=".6" />
      <stop offset=".5" stop-color="#4fb8e8" stop-opacity=".14" />
      <stop offset="1" stop-color="#4fb8e8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="i-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".5" />
      <stop offset=".35" stop-color="#fff" stop-opacity=".07" />
      <stop offset="1" stop-color="#fff" stop-opacity=".12" />
    </linearGradient>
    <linearGradient id="i-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232b66" />
      <stop offset="1" stop-color="#161c4a" />
    </linearGradient>
    <radialGradient id="i-screen-glow" cx=".5" cy="1" r=".75">
      <stop offset="0" stop-color="#a3b0ff" stop-opacity=".7" />
      <stop offset=".6" stop-color="#7f8fff" stop-opacity=".12" />
      <stop offset="1" stop-color="#7f8fff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="i-desk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a4380" stop-opacity="0" />
      <stop offset=".5" stop-color="#5a66c8" />
      <stop offset="1" stop-color="#3a4380" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="i-hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2036" />
      <stop offset="1" stop-color="#0c0f1a" />
    </linearGradient>
    <linearGradient id="i-torso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181e33" />
      <stop offset=".55" stop-color="#090b13" />
    </linearGradient>
    <linearGradient id="i-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3bfff" />
      <stop offset=".3" stop-color="#5fd4ec" stop-opacity=".6" />
      <stop offset=".75" stop-color="#5fd4ec" stop-opacity="0" />
    </linearGradient>
    <filter id="i-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" /></filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28" /></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000" flood-opacity=".55" />
    </filter>
    <clipPath id="i-tile"><rect x="64" y="64" width="896" height="896" rx="220" /></clipPath>
    <path id="i-hood-shape" d="M512 364C454 364 410 402 399 468C390 522 386 592 376 646C428 704 596 704 648 646C638 592 634 522 625 468C614 402 570 364 512 364Z" />
    <path id="i-torso-shape" d="M440 612C346 628 268 668 236 724C206 776 198 866 196 1000H828C826 866 818 776 788 724C756 668 678 628 584 612Z" />
    <clipPath id="i-hood-clip"><use href="#i-hood-shape" /></clipPath>
    <clipPath id="i-torso-clip"><use href="#i-torso-shape" /></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="440" fill="url(#bg)" />
    <rect width="1200" height="440" fill="url(#grid)" mask="url(#grid-mask)" />
    <ellipse class="glow-a" cx="360" cy="110" rx="330" ry="200" fill="url(#glow-indigo)" />
    <ellipse class="glow-b" cx="880" cy="330" rx="340" ry="190" fill="url(#glow-cyan)" />

    <g fill="#dfe4ff">
      <circle class="star" cx="118" cy="74" r="1.6" />
      <circle class="star" cx="236" cy="322" r="1.2" style="animation-delay:-1.2s" />
      <circle class="star" cx="302" cy="168" r="1.4" style="animation-delay:-2.6s" />
      <circle class="star" cx="412" cy="58" r="1.1" style="animation-delay:-.6s" />
      <circle class="star" cx="168" cy="236" r="1.3" style="animation-delay:-3.1s" />
      <circle class="star" cx="1062" cy="92" r="1.5" style="animation-delay:-1.8s" />
      <circle class="star" cx="954" cy="182" r="1.2" style="animation-delay:-.3s" />
      <circle class="star" cx="1112" cy="266" r="1.4" style="animation-delay:-2.2s" />
      <circle class="star" cx="818" cy="62" r="1.1" style="animation-delay:-3.5s" />
      <circle class="star" cx="1020" cy="372" r="1.3" style="animation-delay:-1s" />
      <circle class="star" cx="88" cy="388" r="1.2" style="animation-delay:-2.9s" />
      <circle class="star" cx="760" cy="206" r="1" style="animation-delay:-1.5s" />
    </g>

    <!-- Halo and orbits around the icon -->
    <circle class="halo" cx="600" cy="133" r="132" fill="url(#halo)" />
    <g mask="url(#orbit-fade)">
      <g class="orbit">
        <ellipse cx="600" cy="133" rx="118" ry="118" fill="none" stroke="#9aa4ff" stroke-opacity=".22" stroke-dasharray="2 9" />
        <circle cx="718" cy="133" r="3.5" fill="#8fe6f6" />
      </g>
      <g class="orbit rev">
        <ellipse cx="600" cy="133" rx="140" ry="140" fill="none" stroke="#9aa4ff" stroke-opacity=".12" />
        <circle cx="460" cy="133" r="2.6" fill="#c9c3ff" />
      </g>
    </g>

    <!-- The icon: 896px tile scaled to 170px, centred on x=600 -->
    <g transform="translate(502.7 36) scale(.19)">
      <rect x="64" y="64" width="896" height="896" rx="220" fill="url(#i-bg)" />
      <g clip-path="url(#i-tile)">
        <rect x="64" y="64" width="896" height="896" fill="url(#i-spill)" />
        <rect x="64" y="652" width="896" height="308" fill="#080a12" opacity=".6" />
        <rect x="64" y="646" width="896" height="10" fill="url(#i-desk)" />
        <rect x="232" y="182" width="560" height="410" rx="44" fill="#090c15" />
        <rect x="234" y="184" width="556" height="406" rx="42" fill="none" stroke="#c8d0ff" stroke-opacity=".16" stroke-width="4" />
        <rect x="258" y="208" width="508" height="358" rx="24" fill="url(#i-screen)" />
        <rect class="screen-glow" x="258" y="208" width="508" height="358" rx="24" fill="url(#i-screen-glow)" />
        <g stroke-linecap="round" stroke-width="22">
          <path class="ln" d="M302 262h84" stroke="#b69cff" />
          <path class="ln" d="M408 262h150" stroke="#8b97ff" style="animation-delay:.25s" />
          <path class="ln" d="M342 310h70" stroke="#5ad8ee" style="animation-delay:.5s" />
          <path class="ln" d="M434 310h180" stroke="#e3e7ff" stroke-opacity=".72" style="animation-delay:.75s" />
          <path class="ln" d="M342 358h124" stroke="#8b97ff" style="animation-delay:1s" />
          <path class="ln" d="M488 358h100" stroke="#ffc27a" style="animation-delay:1.25s" />
          <path class="ln" d="M610 358h62" stroke="#e3e7ff" stroke-opacity=".45" style="animation-delay:1.5s" />
          <path class="ln" d="M382 406h116" stroke="#e3e7ff" stroke-opacity=".6" style="animation-delay:1.75s" />
          <path class="ln" d="M342 454h64" stroke="#b69cff" style="animation-delay:2s" />
          <path class="ln" d="M302 502h44" stroke="#8b97ff" style="animation-delay:2.25s" />
        </g>
        <rect class="cursor" x="366" y="489" width="16" height="28" rx="4" fill="#7ee6f5" />
        <path class="spark" d="M718 236c2.6 17.6 10 25 27.6 27.6-17.6 2.6-25 10-27.6 27.6-2.6-17.6-10-25-27.6-27.6 17.6-2.6 25-10 27.6-27.6z" fill="#e3e7ff" />
        <g class="coder">
          <use href="#i-torso-shape" fill="url(#i-torso)" />
          <g clip-path="url(#i-torso-clip)">
            <use href="#i-torso-shape" fill="none" stroke="url(#i-edge)" stroke-width="14" filter="url(#i-soft)" />
            <use href="#i-torso-shape" fill="none" stroke="url(#i-edge)" stroke-width="5" opacity=".7" />
            <ellipse cx="512" cy="684" rx="150" ry="44" fill="#04060b" opacity=".7" filter="url(#i-soft)" />
          </g>
          <use href="#i-hood-shape" fill="url(#i-hood)" />
          <g clip-path="url(#i-hood-clip)">
            <use href="#i-hood-shape" fill="none" stroke="url(#i-edge)" stroke-width="16" filter="url(#i-soft)" />
            <use href="#i-hood-shape" fill="none" stroke="url(#i-edge)" stroke-width="5" />
            <path d="M512 370V690" stroke="#04060b" stroke-opacity=".45" stroke-width="5" />
            <path d="M376 646C428 704 596 704 648 646" fill="none" stroke="#8b97ff" stroke-opacity=".28" stroke-width="6" />
          </g>
        </g>
      </g>
      <rect x="70" y="70" width="884" height="884" rx="214" fill="none" stroke="url(#i-rim)" stroke-width="12" />
    </g>

    <g font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="600" y="296" font-size="58" font-weight="800" letter-spacing="-1.2" fill="#f5f6ff" text-rendering="geometricPrecision">Make Your Life Easier<tspan fill="#5ad8ee">.</tspan></text>
      <text class="rise" x="600" y="336" font-size="19" fill="#aab3d4" style="animation-delay:.15s">Apps, game saves, cleanup and Windows tools — all in one quiet place.</text>
    </g>

    <!-- Chips, centred as a row of 503px -->
    <g class="rise" font-family="'Segoe UI', Inter, system-ui, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.1" style="animation-delay:.3s">
      <rect x="348.5" y="366" width="104" height="32" rx="16" fill="#151c31" stroke="#8e9bd0" stroke-opacity=".22" />
      <circle class="chip-dot" cx="369" cy="382" r="4" fill="#8b83ff" />
      <text x="381" y="386.5" fill="#dfe3fb">TAURI 2</text>
      <rect x="464.5" y="366" width="113" height="32" rx="16" fill="#151c31" stroke="#8e9bd0" stroke-opacity=".22" />
      <circle class="chip-dot" cx="485" cy="382" r="4" fill="#ff8a5c" style="animation-delay:-.6s" />
      <text x="497" y="386.5" fill="#dfe3fb">SVELTE 5</text>
      <rect x="589.5" y="366" width="78" height="32" rx="16" fill="#151c31" stroke="#8e9bd0" stroke-opacity=".22" />
      <circle class="chip-dot" cx="610" cy="382" r="4" fill="#f0b86e" style="animation-delay:-1.2s" />
      <text x="622" y="386.5" fill="#dfe3fb">RUST</text>
      <rect x="679.5" y="366" width="172" height="32" rx="16" fill="#151c31" stroke="#8e9bd0" stroke-opacity=".22" />
      <circle class="chip-dot" cx="700" cy="382" r="4" fill="#5ad8ee" style="animation-delay:-1.8s" />
      <text x="712" y="386.5" fill="#dfe3fb">WINDOWS 10 / 11</text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="438" rx="30" fill="none" stroke="url(#frame)" stroke-width="1.5" />
</svg>
