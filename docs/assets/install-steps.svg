<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="t d">
  <title id="t">Install in three steps</title>
  <desc id="d">Download MakeYourLifeEasier.exe, install it for your account without administrator rights, and it keeps itself up to date on every start.</desc>
  <style>
    text { font-family: 'Segoe UI Variable Text', 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; text-anchor: middle; }
    .title { font-size: 19px; font-weight: 700; fill: #eef0ff; }
    .desc { font-size: 13.5px; fill: #9aa3c7; }
    .node { animation: node 4.5s ease-in-out infinite; }
    .halo { transform-box: fill-box; transform-origin: center; animation: halo 4.5s ease-in-out infinite; }
    @keyframes node { 0%, 100% { stroke-opacity: .3; } 10%, 36% { stroke-opacity: 1; } }
    @keyframes halo { 0%, 100% { opacity: 0; transform: scale(.8); } 14% { opacity: .55; transform: scale(1.15); } 36% { opacity: 0; transform: scale(1.3); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .node { stroke-opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#151c31" />
      <stop offset="1" stop-color="#0e1325" />
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#aab4ff" stop-opacity=".26" />
      <stop offset="1" stop-color="#aab4ff" stop-opacity=".07" />
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8b83ff" />
      <stop offset=".5" stop-color="#58d39a" />
      <stop offset="1" stop-color="#5ad8ee" />
    </linearGradient>
  </defs>

  <rect x=".75" y=".75" width="1198.5" height="198.5" rx="24" fill="url(#face)" stroke="url(#edge)" stroke-width="1.5" />

  <path d="M236 66H564M636 66H964" stroke="#fff" stroke-opacity=".08" stroke-width="3" stroke-linecap="round" />
  <path d="M236 66H564M636 66H964" stroke="url(#track)" stroke-width="3" stroke-linecap="round" stroke-dasharray="728" stroke-dashoffset="728">
    <animate attributeName="stroke-dashoffset" values="728;0;0;728" keyTimes="0;.62;.9;1" dur="4.5s" repeatCount="indefinite" />
  </path>

  <!-- 1 · Download -->
  <circle class="halo" cx="200" cy="66" r="34" fill="#8b83ff" />
  <circle class="node" cx="200" cy="66" r="30" fill="#10162a" stroke="#8b83ff" stroke-width="2" />
  <g fill="none" stroke="#c3beff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M200 54v17M193 64l7 7 7-7M191 78h18" />
  </g>
  <text class="title" x="200" y="134">Download</text>
  <text class="desc" x="200" y="160">MakeYourLifeEasier.exe</text>

  <!-- 2 · Install -->
  <circle class="halo" cx="600" cy="66" r="34" fill="#58d39a" style="animation-delay:1.5s" />
  <circle class="node" cx="600" cy="66" r="30" fill="#10162a" stroke="#58d39a" stroke-width="2" style="animation-delay:1.5s" />
  <g fill="none" stroke="#9fe8c4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="587" y="54" width="26" height="24" rx="4" /><path d="M587 61h26M593 70l4 4 7-7" />
  </g>
  <text class="title" x="600" y="134">Install</text>
  <text class="desc" x="600" y="160">for your account, no admin needed</text>

  <!-- 3 · Ready -->
  <circle class="halo" cx="1000" cy="66" r="34" fill="#5ad8ee" style="animation-delay:3s" />
  <circle class="node" cx="1000" cy="66" r="30" fill="#10162a" stroke="#5ad8ee" stroke-width="2" style="animation-delay:3s" />
  <path d="M1000 50c1.6 10.4 5.6 14.4 16 16-10.4 1.6-14.4 5.6-16 16-1.6-10.4-5.6-14.4-16-16 10.4-1.6 14.4-5.6 16-16z" fill="#b5eef8" />
  <text class="title" x="1000" y="134">Ready</text>
  <text class="desc" x="1000" y="160">updates itself on every launch</text>
</svg>
