<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Source for all app icons: `npx tauri icon app-icon.svg`.
       A hooded coder, back to us, writing code on a glowing screen.
       The in-app mark (src/lib/components/Logo.svelte) draws the same scene. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a45" />
      <stop offset="1" stop-color="#0c0f18" />
    </linearGradient>
    <radialGradient id="spill" cx=".5" cy=".42" r=".58">
      <stop offset="0" stop-color="#6f7dff" stop-opacity=".6" />
      <stop offset=".5" stop-color="#4fb8e8" stop-opacity=".14" />
      <stop offset="1" stop-color="#4fb8e8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".5" />
      <stop offset=".35" stop-color="#fff" stop-opacity=".07" />
      <stop offset="1" stop-color="#fff" stop-opacity=".12" />
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232b66" />
      <stop offset="1" stop-color="#161c4a" />
    </linearGradient>
    <radialGradient id="screen-glow" cx=".5" cy="1" r=".75">
      <stop offset="0" stop-color="#a3b0ff" stop-opacity=".7" />
      <stop offset=".6" stop-color="#7f8fff" stop-opacity=".12" />
      <stop offset="1" stop-color="#7f8fff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a4380" stop-opacity="0" />
      <stop offset=".5" stop-color="#5a66c8" />
      <stop offset="1" stop-color="#3a4380" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2036" />
      <stop offset="1" stop-color="#0c0f1a" />
    </linearGradient>
    <linearGradient id="torso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181e33" />
      <stop offset=".55" stop-color="#090b13" />
    </linearGradient>
    <!-- Screen light catching the edges of the silhouette. -->
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3bfff" />
      <stop offset=".3" stop-color="#5fd4ec" stop-opacity=".6" />
      <stop offset=".75" stop-color="#5fd4ec" stop-opacity="0" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <clipPath id="tile">
      <rect x="64" y="64" width="896" height="896" rx="220" />
    </clipPath>
    <path id="hood-shape" d="M512 364C454 364 410 402 399 468C390 522 386 592 376 646C428 704 596 704 648 646C638 592 634 522 625 468C614 402 570 364 512 364Z" />
    <path id="torso-shape" d="M440 612C346 628 268 668 236 724C206 776 198 866 196 1000H828C826 866 818 776 788 724C756 668 678 628 584 612Z" />
    <clipPath id="hood-clip"><use href="#hood-shape" /></clipPath>
    <clipPath id="torso-clip"><use href="#torso-shape" /></clipPath>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="220" fill="url(#bg)" />
  <g clip-path="url(#tile)">
    <rect x="64" y="64" width="896" height="896" fill="url(#spill)" />

    <!-- Desk -->
    <rect x="64" y="652" width="896" height="308" fill="#080a12" opacity=".6" />
    <rect x="64" y="646" width="896" height="10" fill="url(#desk)" />

    <!-- Monitor -->
    <rect x="232" y="182" width="560" height="410" rx="44" fill="#090c15" />
    <rect x="234" y="184" width="556" height="406" rx="42" fill="none" stroke="#c8d0ff" stroke-opacity=".16" stroke-width="4" />
    <rect x="258" y="208" width="508" height="358" rx="24" fill="url(#screen)" />
    <rect x="258" y="208" width="508" height="358" rx="24" fill="url(#screen-glow)" />

    <!-- Code, cursor and the brand sparkle -->
    <g stroke-linecap="round" stroke-width="22">
      <path d="M302 262h84" stroke="#b69cff" />
      <path d="M408 262h150" stroke="#8b97ff" />
      <path d="M342 310h70" stroke="#5ad8ee" />
      <path d="M434 310h180" stroke="#e3e7ff" stroke-opacity=".72" />
      <path d="M342 358h124" stroke="#8b97ff" />
      <path d="M488 358h100" stroke="#ffc27a" />
      <path d="M610 358h62" stroke="#e3e7ff" stroke-opacity=".45" />
      <path d="M382 406h116" stroke="#e3e7ff" stroke-opacity=".6" />
      <path d="M342 454h64" stroke="#b69cff" />
      <path d="M302 502h44" stroke="#8b97ff" />
    </g>
    <rect x="366" y="489" width="16" height="28" rx="4" fill="#7ee6f5" />
    <path d="M718 236c2.6 17.6 10 25 27.6 27.6-17.6 2.6-25 10-27.6 27.6-2.6-17.6-10-25-27.6-27.6 17.6-2.6 25-10 27.6-27.6z" fill="#e3e7ff" opacity=".9" />

    <!-- The hooded coder, lit from the front by the screen -->
    <use href="#torso-shape" fill="url(#torso)" />
    <g clip-path="url(#torso-clip)">
      <use href="#torso-shape" fill="none" stroke="url(#edge)" stroke-width="14" filter="url(#soft)" />
      <use href="#torso-shape" fill="none" stroke="url(#edge)" stroke-width="5" opacity=".7" />
      <ellipse cx="512" cy="684" rx="150" ry="44" fill="#04060b" opacity=".7" filter="url(#soft)" />
    </g>
    <use href="#hood-shape" fill="url(#hood)" />
    <g clip-path="url(#hood-clip)">
      <use href="#hood-shape" fill="none" stroke="url(#edge)" stroke-width="16" filter="url(#soft)" />
      <use href="#hood-shape" fill="none" stroke="url(#edge)" stroke-width="5" />
      <path d="M512 370V690" stroke="#04060b" stroke-opacity=".45" stroke-width="5" />
      <path d="M376 646C428 704 596 704 648 646" fill="none" stroke="#8b97ff" stroke-opacity=".28" stroke-width="6" />
    </g>
  </g>
  <rect x="70" y="70" width="884" height="884" rx="214" fill="none" stroke="url(#rim)" stroke-width="12" />
</svg>
