<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <filter id="sum-shadow" x="20" y="20" width="216" height="220" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.72" />
    </filter>
    <linearGradient id="sum-bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#292108" />
      <stop offset="52%" stop-color="#171204" />
      <stop offset="100%" stop-color="#0A0802" />
    </linearGradient>
    <radialGradient id="sum-glow-top" cx="28%" cy="18%" r="78%">
      <stop offset="0%" stop-color="#FFD600" stop-opacity="0.38" />
      <stop offset="55%" stop-color="#CA8A04" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#171204" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sum-glow-bottom" cx="82%" cy="86%" r="62%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#171204" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sum-rim" x1="128" y1="0" x2="128" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.62" />
      <stop offset="25%" stop-color="#FFD600" stop-opacity="0.3" />
      <stop offset="80%" stop-color="#422006" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#FACC15" stop-opacity="0.4" />
    </linearGradient>
