<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <filter id="bios-emblem-shadow" x="28" y="28" width="200" height="204" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#010613" flood-opacity="0.78" />
    </filter>

    <linearGradient id="bios-bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B2247" />
      <stop offset="52%" stop-color="#061329" />
      <stop offset="100%" stop-color="#020813" />
    </linearGradient>

    <radialGradient id="bios-glow-top" cx="28%" cy="18%" r="78%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38" />
      <stop offset="55%" stop-color="#2563EB" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#061329" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="bios-glow-bottom" cx="82%" cy="86%" r="62%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#061329" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="bios-glass-rim" x1="128" y1="0" x2="128" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.65" />
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.32" />
      <stop offset="80%" stop-color="#1E3A8A" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.42" />
    </linearGradient>

    <linearGradient id="bios-sheen" x1="128" y1="0" x2="128" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="bios-chip-grad" x1="72" y1="68" x2="184" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="50%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="bios-pins-grad" x1="52" y1="52" x2="204" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <clipPath id="bios-squircle-clip">
      <rect x="0" y="0" width="256" height="256" rx="58" />
    </clipPath>
  </defs>

  <g clip-path="url(#bios-squircle-clip)">
    <rect x="0" y="0" width="256" height="256" fill="url(#bios-bg)" />
    <rect x="0" y="0" width="256" height="256" fill="url(#bios-glow-top)" />
    <rect x="0" y="0" width="256" height="256" fill="url(#bios-glow-bottom)" />
    <ellipse cx="128" cy="4" rx="126" ry="64" fill="url(#bios-sheen)" />
  </g>

  <rect x="1.5" y="1.5" width="253" height="253" rx="56.5" stroke="url(#bios-glass-rim)" stroke-width="3" />

  <g filter="url(#bios-emblem-shadow)">
    <!-- CPU Pins Top & Bottom -->
    <path d="M96 52V70M128 52V70M160 52V70M96 186V204M128 186V204M160 186V204" stroke="url(#bios-pins-grad)" stroke-width="12" stroke-linecap="round" />
    <!-- CPU Pins Left & Right -->
    <path d="M52 96H70M52 128H70M52 160H70M186 96H204M186 128H204M186 160H204" stroke="url(#bios-pins-grad)" stroke-width="12" stroke-linecap="round" />
    <!-- Outer Chip Frame -->
    <rect x="70" y="70" width="116" height="116" rx="24" fill="#071936" stroke="url(#bios-chip-grad)" stroke-width="12" />
    <!-- Inner Die Core -->
    <rect x="98" y="98" width="60" height="60" rx="12" fill="url(#bios-chip-grad)" />
    <circle cx="128" cy="128" r="12" fill="#061329" />
  </g>
</svg>
