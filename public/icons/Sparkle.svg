<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <!-- Inner Emblem Subtle 3D Shadow -->
    <filter id="spk-emblem-shadow" x="24" y="24" width="208" height="208" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000814" flood-opacity="0.7" />
    </filter>

    <!-- Main Deep Midnight-Teal Background -->
    <linearGradient id="spk-bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A2239" />
      <stop offset="50%" stop-color="#051322" />
      <stop offset="100%" stop-color="#020810" />
    </linearGradient>

    <!-- Ambient Electric Cyan-Aqua Glow -->
    <radialGradient id="spk-glow-top" cx="28%" cy="18%" r="78%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.40" />
      <stop offset="55%" stop-color="#0077C2" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#051322" stop-opacity="0" />
    </radialGradient>

    <!-- Bottom-Right Secondary Glow -->
    <radialGradient id="spk-glow-bottom" cx="82%" cy="86%" r="62%">
      <stop offset="0%" stop-color="#64FFDA" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#051322" stop-opacity="0" />
    </radialGradient>

    <!-- macOS 3D Glass Bevel Border -->
    <linearGradient id="spk-glass-rim" x1="128" y1="0" x2="128" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B2EBF2" stop-opacity="0.68" />
      <stop offset="25%" stop-color="#00E5FF" stop-opacity="0.32" />
      <stop offset="80%" stop-color="#003354" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#64FFDA" stop-opacity="0.42" />
    </linearGradient>

    <!-- Top Specular Sheen -->
    <linearGradient id="spk-sheen" x1="128" y1="0" x2="128" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Smooth Continuous Star Gradient (Χωρίς γραμμή στη μέση) -->
    <linearGradient id="spk-star-main" x1="116" y1="54" x2="116" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8FBFF" />
      <stop offset="45%" stop-color="#40C4FF" />
      <stop offset="100%" stop-color="#0091EA" />
    </linearGradient>

    <!-- Secondary Accent Star Gradient -->
    <linearGradient id="spk-star-accent" x1="188" y1="38" x2="188" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B2FF59" stop-opacity="0" />
      <stop offset="0%" stop-color="#A7FFEB" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- macOS Squircle Clip -->
    <clipPath id="spk-squircle-clip">
      <rect x="0" y="0" width="256" height="256" rx="58" />
    </clipPath>
  </defs>

  <!-- Base Squircle & Internal Lighting (Χωρίς εξωτερικό shadow) -->
  <g clip-path="url(#spk-squircle-clip)">
    <rect x="0" y="0" width="256" height="256" fill="url(#spk-bg)" />
    <rect x="0" y="0" width="256" height="256" fill="url(#spk-glow-top)" />
    <rect x="0" y="0" width="256" height="256" fill="url(#spk-glow-bottom)" />
    <!-- Top Glass Reflection Curve -->
    <ellipse cx="128" cy="4" rx="126" ry="64" fill="url(#spk-sheen)" />
  </g>

  <!-- 3D Inner Glass Rim -->
  <rect x="1.5" y="1.5" width="253" height="253" rx="56.5" stroke="url(#spk-glass-rim)" stroke-width="3" />

  <!-- Sparkle Smooth Constellation Emblem -->
  <g filter="url(#spk-emblem-shadow)">
    <!-- 1. Main Central 4-Point Sparkle (Ενιαίο, χωρίς γραμμή) -->
    <path d="M116 54C120 101 145 126 196 134C145 142 120 167 116 214C112 167 87 142 36 134C87 126 112 101 116 54Z" fill="url(#spk-star-main)" />

    <!-- 2. Top-Right Companion Sparkle -->
    <path d="M188 38C190.2 58 199 66.8 219 69C199 71.2 190.2 80 188 100C185.8 80 177 71.2 157 69C177 66.8 185.8 58 188 38Z" fill="url(#spk-star-accent)" />

    <!-- 3. Bottom-Left Mini Sparkle -->
    <path d="M62 170C63.5 182.5 69.5 188.5 82 190C69.5 191.5 63.5 197.5 62 210C60.5 197.5 54.5 191.5 42 190C54.5 188.5 60.5 182.5 62 170Z" fill="#B2EBF2" />
  </g>
</svg>